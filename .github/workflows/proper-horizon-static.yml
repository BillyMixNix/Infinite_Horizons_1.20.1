name: Proper Horizon Static Validation

on:
  push:
    branches:
      - master
      - agent/proper-infinite-horizon
  pull_request:

permissions:
  contents: read

jobs:
  validate-pack-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate quests, recipes, and world preset
        run: python tools/validate_pack.py

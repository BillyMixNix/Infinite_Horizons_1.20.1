
[world-preset]
	# Proper Infinite Horizons uses a data-driven flat preset with real geological depth,
	# biome features, ore placement, and selected structures.
	world-preset = "proper_horizon:deep_flat"
	# This legacy string is unused while the custom preset above is selected.
	flat-settings = "minecraft:bedrock,64*minecraft:deepslate,60*minecraft:stone,4*minecraft:dirt,minecraft:grass_block;minecraft:plains"
	# Only used by minecraft:single_biome_surface.
	single-biome-biome = "minecraft:plains"
	# Keep the selector available during development so testers can compare presets.
	disable-button = false
	# If empty, all registered world types remain available.
	allowed-world-types = []

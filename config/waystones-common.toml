
[xpCost]
	# Longer jumps have a real personal cost so trains remain the bulk logistics system.
	inverseXpCost = false
	blocksPerXpLevel = 2000
	minimumBaseXpCost = 1.0
	maximumBaseXpCost = 10.0
	xpCostPerLeashed = 1
	dimensionalWarpXpCost = 10
	globalWaystoneXpCostMultiplier = 1.0
	warpStoneXpCostMultiplier = 1.0
	waystoneXpCostMultiplier = 1.0
	sharestoneXpCostMultiplier = 1.0
	portstoneXpCostMultiplier = 1.0
	warpPlateXpCostMultiplier = 1.0
	inventoryButtonXpCostMultiplier = 1.0

[restrictions]
	restrictToCreative = false
	restrictRenameToOwner = false
	generatedWaystonesUnbreakable = false
	transportLeashed = true
	transportLeashedDimensional = false
	leashedDenyList = ["minecraft:wither"]
	# Dimensions should remain journeys with their own infrastructure.
	dimensionalWarp = "DENY"
	dimensionalWarpAllowList = []
	dimensionalWarpDenyList = []
	allowWaystoneToWaystoneTeleport = true
	globalWaystoneSetupRequiresCreativeMode = true

[cooldowns]
	globalWaystoneCooldownMultiplier = 1.0
	warpStoneCooldown = 60
	warpStoneUseTime = 48
	warpPlateUseTime = 40
	scrollUseTime = 48
	inventoryButtonCooldown = 300

[inventoryButton]
	inventoryButton = ""
	warpButtonX = 58
	warpButtonY = 60
	creativeWarpButtonX = 88
	creativeWarpButtonY = 33

[worldGen]
	worldGenStyle = "BIOME"
	# The player builds the network after establishing physical routes.
	frequency = 0
	dimensionAllowList = ["minecraft:overworld"]
	dimensionDenyList = []
	nameGenerationMode = "PRESET_FIRST"
	customWaystoneNames = []
	spawnInVillages = false
	forceSpawnInVillages = false

[client]
	disableTextGlow = false

[compatibility]
	displayWaystonesOnJourneyMap = true
	preferJourneyMapIntegration = true
